# Continuous deployment to GitHub Pages.
#
# - Push to `prod`            → real release. Refuses to publish while placeholder content remains.
# - Manual run, preview=true  → review build (any branch, e.g. dev): allows sample content,
#                               shows a "Vorschau" banner + placeholder badges, noindex.
#     gh workflow run deploy.yml --ref dev -f preview=true
# - Called by content-publish.yml → publishes edits made in the content editor (yarn cms).
#
# One-time setup: Settings → Pages → Source: "GitHub Actions";
# Settings → Environments → github-pages → allow the branches you deploy from
# (prod, dev, content-management).
name: Deploy

on:
  push:
    branches: [prod]
  workflow_dispatch:
    inputs:
      preview:
        description: 'Preview build (allows sample content, shows banner, noindex)'
        type: boolean
        default: true
  workflow_call:
    inputs:
      preview:
        type: boolean
        default: false
      ref:
        description: 'Branch to build (default: the triggering branch)'
        type: string
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PREVIEW: ${{ inputs.preview == true && 'true' || 'false' }}
      DEPLOY_REF: ${{ inputs.ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_REF }}

      - name: Only prod may publish a non-preview release
        if: env.PREVIEW != 'true' && env.DEPLOY_REF != 'prod'
        run: |
          echo "::error::Real releases are deployed from 'prod' only. Use preview=true for other branches."
          exit 1

      - name: Enable Corepack (pinned Yarn)
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - run: yarn install --immutable
      - run: yarn typecheck
      - run: yarn lint
      - run: yarn test

      - name: Refuse to publish sample/placeholder content
        if: env.PREVIEW != 'true'
        run: yarn content:check:strict

      - name: Placeholder report (preview)
        if: env.PREVIEW == 'true'
        run: yarn content:check

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build
        env:
          # "" for a custom domain root, "/<repo>" for a project page
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          VITE_PREVIEW: ${{ env.PREVIEW }}
        run: yarn build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
