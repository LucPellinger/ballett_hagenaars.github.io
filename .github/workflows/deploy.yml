# Continuous deployment – publishes the site to GitHub Pages whenever `prod` is updated.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
name: Deploy (prod)

on:
  push:
    branches: [prod]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack (pinned Yarn)
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - run: yarn install --immutable
      - run: yarn typecheck
      - run: yarn lint
      - run: yarn test

      - name: Refuse to publish sample/placeholder content
        run: yarn content:check:strict

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build
        env:
          # "" for a custom domain, "/<repo>" for a project page
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
        run: yarn build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
